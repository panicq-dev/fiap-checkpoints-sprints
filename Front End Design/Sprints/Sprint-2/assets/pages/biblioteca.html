<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta nome="viewport" content="width=device-width, initial-scale=1.0">
  <titulo>Biblioteca</titulo>
  <link rel="stylesheet" href="./../css/style.css">
  <link rel="stylesheet" href="./../css/biblioteca.css">
</head>
<body>
  <div class="container">
  <div class="telefone" style="grid-column:5;grid-row:1">
      <div class="lib-body">
        <div class="lib-header">
          <div class="lib-titulo">Biblioteca</div>
          <div class="lib-add">+</div>
        </div>
        <div class="pasta">
          <div class="pasta-header">
            <span class="pasta-icon">📁</span>
            <span class="pasta-nome">Ciências</span>
          </div>
          <div class="pasta-item">
            <div class="pasta-item-icon">🧬</div>
            <div class="pasta-item-info">
              <div class="pasta-item-titulo">Biologia</div>
              <div class="pasta-item-subT">12 cards | Ultima visualização: 2h</div>
              <div class="pasta-progresso">
                <div class="pasta-progresso-fill" style="width:75%">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="pasta">
          <div class="pasta-header">
            <span class="pasta-icon">📁</span>
            <span class="pasta-nome">Linguagens</span>
          </div>
          <div class="pasta-item">
            <div class="pasta-item-icon">🌐</div>
            <div class="pasta-item-info">
              <div class="pasta-item-titulo">Inglês</div>
                <div class="pasta-item-subT">17 cards | Ultima visualização: 1m</div>
                  <div class="pasta-progresso">
                    <div class="pasta-progresso-fill" style="width:55%">
                    </div>
              </div>
            </div>
          </div>
        </div>
        <div class="pasta">
          <div class="pasta-header">
            <span class="pasta-icon">📁</span>
            <span class="pasta-nome">Historia</span>
          </div>
          <div class="pasta-item">
            <div class="pasta-item-icon">🏛</div>
            <div class="pasta-item-info">
              <div class="pasta-item-titulo">História do Brasil</div>
              <div class="pasta-item-subT">17 cards | Ultima visualização: 17m</div>
              <div class="pasta-progresso">
                <div class="pasta-progresso-fill" style="width:40%">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="botao-nav">
        <div class="nav-item"><div class="nav-icon">🏠</div>Home</div>
        <div class="nav-item ativado"><div class="nav-icon">📚</div>Biblioteca</div>
        <div class="nav-item"><div class="nav-icon">📷</div>Camera</div>
        <div class="nav-item"><div class="nav-icon">👤</div>Conta</div>
      </div>
    </div>
  </div>
</body>
</html>
